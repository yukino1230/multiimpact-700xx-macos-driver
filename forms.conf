# 2026-09-01 実測(15インチ連続紙・フロントトラクタ・mi700align):
#   ページ原点 X = 用紙左端から 33mm / Y = ミシン目そのもの(0mm)
#   → 15インチの右余白は 12.7+33 = 45.7mm。10インチ側は当時の実測(32mm)のまま 44.7mm
#   吸入位置(パラメータ 6.03mm)はビットイメージの原点に影響しない。文字印刷の行位置の設定
# --- 連続紙(トラクタ): 上下余白0(既定) ---
# macOS の用紙サイズメニューは「用紙寸法が同じもの」を1つのグループにまとめ、
# 印字領域が最大のものをグループ名に使う。余白0版を素の用紙名にしておくことで
# グループ名が「連続紙 10x11インチ」のようになる。
