# NEC MultiImpact 700XX 用紙定義
#
# 列: 名前<TAB>表示名<TAB>幅mm<TAB>高さmm<TAB>左mm<TAB>右mm<TAB>上mm<TAB>下mm
#     5〜8列目は「ページ座標での印字不可領域」。省略時は0。
#
# --- 余白の求め方 ---
# ページの原点は用紙の左上ではない。実測値(この機体):
#     カット紙   左 4.7mm / 上 1.0mm   リアトラクタ 左 32mm / 上 ほぼ0mm
# 用紙設計説明書(NEC)のカット紙・水平型の推奨印刷範囲:
#     用紙左端から第1桁目 6.3mm以上 / 用紙右端から最終桁 6.3mm以上
#     用紙上端から第1印刷行 9.73mm以上 / 用紙下端から最終印刷行 6.3mm以上
# ページ座標では、右と下はページが用紙をはみ出す分を足す:
#     左 6.3-4.7=1.6 / 右 6.3+4.7=11.0 / 上 9.73-1.0=8.7 / 下 6.3+1.0=7.3
#
# 最大印刷範囲(左右1.5mm/上0mm/下3mm)を使えば用紙を広く使えるが、説明書に
# 「印刷精度が保証できないだけでなく、用紙ジャム、印刷ヘッドの故障等が発生する
#  場合があります」とあるため既定は推奨印刷範囲にしてある。
#
# --- 連続紙(トラクタ)の規格 ---
# 用紙設計説明書 2.2.3 ①(水平型):
#     用紙幅 101〜406.4mm
#     用紙左端から第1桁目 35mm(左トラクタ最左端時)、トラクタで約20mm移動できる
#     ミシン目の影響を避けるため印刷しないことが「望ましい」範囲 上下とも 25.4mm
#     最終用紙下端から最終印刷行 3mm
#     注意: **用紙幅両端から12.7mmの範囲は印刷しないでください**(カット紙の6.3mmより広い)
# ページ座標では原点が用紙左端から32mm(実測)なので:
#     左 12.7-32 → 0 / 右 12.7+32 = 44.7
# ミシン目の25.4mmを適用するかどうかは、Windows ドライバでは**給紙口の設定**である。
# 給紙口の一覧に「リアトラクタ」と「リアトラクタ(上下余白0)」の2つがあり、後者は
# この上下余白を無効にする設定。印刷済み伝票は記入欄がミシン目近くまであるため
# 「上下余白0」で運用するのが普通で、実機のWindows出力も上端7mmから印字している。
# PPD の ImageableArea は用紙サイズ単位でしか指定できず給紙口では切り替えられないため、
# 両方を用紙サイズとして登録し、名前で見分けられるようにしてある。
#   「(上下余白0)」        … ミシン目まわりも印字する。印刷済み伝票はこちら
#   「(ミシン目回避25.4mm)」… 規格どおり上下25.4mmを空ける。汎用の連続紙はこちら
#
# トラクタを動かすと原点が変わる。mi700align で実測して書き直すこと。

