# --- 用途ごとの用紙を足す ---
# 印刷済みの伝票などは、寸法が同じでも分かりやすい名前で登録しておくと選びやすい。
# ただし macOS は用紙寸法が同じものを1つのグループにまとめるので、同寸法の用紙が
# 他にもあると第2階層に入る。単独の項目にしたいときは、同じ寸法の用紙を登録しない。
# 例:
#MyForm	○○伝票	254	114.3	0	44.7	0	0
